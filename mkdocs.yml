site_name: 代数拓扑重点整理
site_description: 依据王炜飚老师《代数拓扑》课程中 Yuu 的讲义建立——重要定义、公式、定理、结论与重要证明，以考点提示标注潜在考察方向。
site_author: GuitarYuu
site_url: https://guitaryuu.github.io/math-algtop-site/
repo_name: GuitarYuu/math-algtop-site
repo_url: https://github.com/GuitarYuu/math-algtop-site
edit_uri: ""
copyright: 仅用于课程学习交流 · 内容整理自课程讲义

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tooltips
  icon:
    logo: material/compass
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      permalink: "#"
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax-config.js
  - javascripts/vendor/mathjax/tex-mml-chtml.js

extra_css:
  - stylesheets/sjtudocs.css

nav:
  - 首页: index.md
  - 课程重点:
    - ch01.md
    - ch02.md
    - ch03.md
    - ch04.md
    - ch05.md
    - ch06.md
    - ch07.md
    - ch08.md
    - ch09.md
    - checklist.md
